spring.application.name=payment-order-service

# Server
server.port=8081

# PostgreSQL connection. Defaults match infrastructure/docker-compose.yml;
# override with environment variables anywhere other than local dev.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/payflow_payments}
spring.datasource.username=${DB_USERNAME:payments_user}
spring.datasource.password=${DB_PASSWORD:payments_dev_password}

# Schema is owned by Flyway (src/main/resources/db/migration).
# Hibernate only checks that the entities match it and never changes it.
spring.jpa.hibernate.ddl-auto=validate

# Lets Flyway adopt a database whose tables already exist from before
# migrations were added: it records V1 as applied and runs V2 onwards.
# An empty database ignores this and runs every migration from V1.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# JPA
spring.jpa.open-in-view=false

# Paging
spring.data.web.pageable.max-page-size=100

# Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
# Wait for all in-sync replicas and let the broker drop duplicate retries.
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true

# Outbox: Kafka topic for each event type. Brackets keep the key's exact case.
payflow.outbox.topics[PaymentOrderCreated]=payment-orders.created
